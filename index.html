<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13172c"><meta name="description" content="Cuenta atrás con puesta de sol. Comparte el tiempo restante por WhatsApp."><title>Cuenta atrás ☀️</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1120;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(100%,480px);border-radius:26px;overflow:hidden;background:#172035;box-shadow:0 24px 80px #0009;border:1px solid #ffffff1f}.top{padding:24px 24px 10px;text-align:center}.eyebrow{color:#ffbd85;letter-spacing:.17em;font-size:11px;font-weight:800}h1{font-size:34px;margin:10px 0 6px;letter-spacing:-.04em}p{color:#c8d0de;line-height:1.5;margin:6px 0 12px}.scene{position:relative;height:310px;overflow:hidden;background:linear-gradient(to bottom,#142849 0%,#4b4e7a 33%,#a65d70 58%,#ef9a67 78%,#fbc58d 100%)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#f6a36433,transparent 65%);pointer-events:none}.stars{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:57px 62px;background-position:13px 19px}.sun{position:absolute;left:50%;top:12%;width:100px;height:100px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 36%,#fff8c6,#ffe282 42%,#ffb545 80%);box-shadow:0 0 35px 16px #ffc55a75,0 0 95px 40px #ffad4b42;will-change:top}.horizon{position:absolute;z-index:3;left:0;right:0;top:78%;height:2px;background:#ffe0b0;box-shadow:0 0 20px #ffb779}.sea{position:absolute;z-index:4;top:78%;bottom:0;left:0;right:0;background:linear-gradient(#6d5770,#283b60 50%,#152c48);overflow:hidden}.reflection{position:absolute;left:50%;top:0;transform:translateX(-50%);width:75%;height:100%;background:repeating-linear-gradient(to bottom,#ffce9d77 0px,#ffce9d33 3px,transparent 5px,transparent 11px);clip-path:polygon(47% 0,53% 0,85% 100%,15% 100%);opacity:.65}.scene.done .sun{opacity:.2}.scene.done{filter:saturate(.5) brightness(.55)}.overlay{position:absolute;z-index:5;top:12px;left:0;right:0;text-align:center;color:#fff7e6;font-size:12px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 5px #0008}.panel{padding:22px 24px 28px;text-align:center}.clock{font-size:clamp(56px,15vw,78px);font-weight:800;letter-spacing:-.07em;font-variant-numeric:tabular-nums;line-height:1.1}.hint{color:#aebcd0;font-size:13px;margin:9px 0 15px}.progress{height:7px;border-radius:8px;background:#36445c;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff8b66,#ffd27d);width:100%}label{display:block;text-align:left;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;background:#0c1629;border:1px solid #52617a;border-radius:12px;color:white;padding:13px;font:inherit}button{width:100%;border:0;border-radius:12px;padding:15px;margin:11px 0 0;background:#ffad6a;color:#261426;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#32425b;color:#fff}.hidden{display:none}.note{color:#aebbd0;font-size:12px;line-height:1.5;margin-top:12px}.status{color:#bce5d0;font-size:13px;min-height:18px;margin-top:12px}footer{font-size:11px;color:#7d91aa;text-align:center;margin:12px}</style></head><body><main class="card"><header class="top"><div class="eyebrow">☀️ EL TIEMPO VUELA</div><h1>Cuenta atrás</h1><p id="description">El sol se pondrá cuando termine el tiempo.</p></header><div id="scene" class="scene"><div class="stars"></div><div id="sun" class="sun"></div><div class="horizon"></div><div class="sea"><div class="reflection"></div></div><div id="skylabel" class="overlay">TU PUESTA DE SOL</div></div><section class="panel"><div id="setup"><label for="minutes">¿Cuántos minutos?</label><input id="minutes" type="number" min="1" max="10080" value="10" inputmode="numeric"><label for="message">Mensaje para tu amigo (opcional)</label><input id="message" maxlength="120" placeholder="¡Responde antes del atardecer!"><button id="start">☀️ Iniciar cuenta atrás</button><div class="note">La cuenta atrás empieza al pulsar Iniciar. Comparte el enlace enseguida.</div></div><div id="active" class="hidden"><div id="clock" class="clock">10:00</div><div class="progress"><span id="progress"></span></div><div id="deadline" class="hint"></div><div id="ownercontrols"><button id="share">Enviar por WhatsApp</button><button class="secondary" id="copy">Copiar enlace</button><button class="secondary" id="again">Crear otra cuenta atrás</button></div><div class="status" id="status"></div></div></section><footer>Cuenta atrás · El mismo atardecer para todos</footer><script>
(()=>{const $=id=>document.getElementById(id),base=location.href.split('#')[0];let timer;function show(end,duration,message){$('setup').classList.add('hidden');$('active').classList.remove('hidden');$('description').textContent=message||'El sol se pondrá cuando termine el tiempo.';$('deadline').textContent='Termina: '+new Date(end).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'medium'});clearInterval(timer);function update(){let ms=Math.max(0,end-Date.now()),seconds=Math.ceil(ms/1000),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60,ratio=Math.min(1,Math.max(0,ms/duration));$('clock').textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('sun').style.top=(12+(1-ratio)*66)+'%';$('progress').style.width=(ratio*100)+'%';$('scene').classList.toggle('done',ms===0);$('skylabel').textContent=ms?'EL SOL ESTÁ DESCENDIENDO':'EL TIEMPO HA TERMINADO';if(!ms){$('description').textContent='Se acabó el tiempo. El sol se ha puesto.';clearInterval(timer)}}update();timer=setInterval(update,200)}
const p=new URLSearchParams(location.hash.slice(1)),end=Number(p.get('end')),duration=Number(p.get('duration'));if(Number.isFinite(end)&&end>0&&Number.isFinite(duration)&&duration>0)show(end,duration,p.get('message')||'');
$('start').onclick=()=>{const n=Number($('minutes').value);if(!Number.isFinite(n)||n<1||n>10080){alert('Introduce un valor entre 1 y 10.080 minutos.');return}const d=Math.round(n*60000),e=Date.now()+d,msg=$('message').value.trim(),params=new URLSearchParams({end:String(e),duration:String(d)});if(msg)params.set('message',msg);history.replaceState(null,'',base+'#'+params.toString());show(e,d,msg)};
$('share').onclick=()=>{const params=new URLSearchParams(location.hash.slice(1)),msg=params.get('message')||'¡Mira cuánto tiempo queda!';const text='☀️⏳ Cuenta atrás: '+msg+'\nEl sol se está poniendo. Mira el tiempo restante aquí:\n'+location.href;window.location.href='https://wa.me/?text='+encodeURIComponent(text)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent='Enlace copiado. Pégalo en WhatsApp.'}catch{prompt('Copia este enlace:',location.href)}};
$('again').onclick=()=>location.href=base;
})();
</script></main></body></html>
