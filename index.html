<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Cuenta atrás</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#263b55,#090f1d 70%);font:16px system-ui,-apple-system,sans-serif;color:#f8fafc}.card{width:min(100%,480px);padding:32px 25px;background:linear-gradient(150deg,#1c2b40,#101827);border:1px solid #39465a;border-radius:26px;text-align:center;box-shadow:0 24px 70px #0007}.tag{color:#ffaaa8;font-size:12px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(29px,8vw,40px);letter-spacing:-.04em;margin:20px 0 10px}p{color:#b5c1d2;line-height:1.5}.clock{font-size:clamp(56px,15vw,82px);font-weight:800;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:25px 0 15px}.bar{height:9px;background:#334155;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#fb923c,#fb5555);width:100%}.small{font-size:13px;color:#9baec4;margin-top:13px}label{display:block;text-align:left;font-size:14px;font-weight:700;margin:20px 0 8px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #526176;background:#0b1423;color:white;font-size:17px}button{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;font:inherit;font-weight:750;cursor:pointer;background:#fa5d59;color:#180b0b}.secondary{background:#304057;color:white}.hidden{display:none}.status{font-size:13px;color:#b8d8c8;margin-top:14px;min-height:20px}footer{color:#8798ad;text-align:center;font-size:12px;margin-top:20px}</style></head>
<body><main><section class="card"><div class="tag">🔴 URGENTE · TIEMPO LIMITADO</div><h1 id="heading">Cuenta atrás</h1><p id="desc">Cada segundo cuenta. Crea una cuenta atrás y compártela.</p>
<div id="setup"><label for="minutes">Duración (minutos)</label><input id="minutes" type="number" min="1" max="10080" value="10"><label for="msg">Mensaje (opcional)</label><input id="msg" maxlength="120" placeholder="Responde antes de que se agote el tiempo"><button id="start">Iniciar cuenta atrás</button><p class="small">Empieza al pulsar Iniciar. El enlace conserva la misma hora límite para todos.</p></div>
<div id="active" class="hidden"><div id="clock" class="clock">10:00</div><div class="bar"><div id="fill" class="fill"></div></div><div id="deadline" class="small"></div><div id="controls"><button id="share">Enviar por WhatsApp</button><button id="copy" class="secondary">Copiar enlace</button><button id="again" class="secondary">Crear otra cuenta atrás</button></div><div id="status" class="status"></div></div></section><footer>Cuenta atrás · Enlace público · Actualización en directo</footer></main>
<script>
(()=>{const $=x=>document.getElementById(x),base=location.href.split('#')[0];let interval;function show(end,duration,msg){$('setup').classList.add('hidden');$('active').classList.remove('hidden');$('desc').textContent=msg||'El tiempo se agota. ¡No te lo pierdas!';$('deadline').textContent='Hora límite: '+new Date(end).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'medium'});clearInterval(interval);function tick(){const s=Math.max(0,Math.ceil((end-Date.now())/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('clock').textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');$('fill').style.width=Math.min(100,s*100000/duration)+'%';$('heading').textContent=s?'El tiempo se agota':'Se acabó el tiempo';if(!s){$('desc').textContent='Esta cuenta atrás ha llegado a su fin.';clearInterval(interval)}}tick();interval=setInterval(tick,250)}
function params(){return new URLSearchParams(location.hash.slice(1))}function init(){const p=params(),end=Number(p.get('end')),d=Number(p.get('duration'));if(end>0&&d>0&&Number.isFinite(end)&&Number.isFinite(d))show(end,d,p.get('message')||'')}init();
$('start').onclick=()=>{const n=Number($('minutes').value);if(!Number.isFinite(n)||n<1||n>10080){alert('Introduce entre 1 y 10.080 minutos.');return}const d=Math.round(n*60000),e=Date.now()+d,m=$('msg').value.trim(),p=new URLSearchParams({end:String(e),duration:String(d)});if(m)p.set('message',m);history.replaceState(null,'',base+'#'+p.toString());show(e,d,m)};
$('share').onclick=()=>{const p=params(),msg=p.get('message')||'Por favor, responde antes de que se agote el tiempo.';const text='⏳ URGENTE — ¡La cuenta atrás ha comenzado!\n'+msg+'\nMira el tiempo restante: '+location.href;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent='Enlace copiado. Pégalo en WhatsApp.'}catch{prompt('Copia el enlace:',location.href)}};
$('again').onclick=()=>{location.href=base};
})();
</script></body></html>
