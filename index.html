<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13172c"><meta name="description" content="Cuenta atrás con reloj de arena. Comparte el tiempo restante por WhatsApp."><title>Cuenta atrás ⏳</title><meta property="og:type" content="website"><meta property="og:title" content="⏳ Cuenta atrás"><meta property="og:description" content="El reloj de arena está en marcha. Descubre cuánto tiempo queda."><meta property="og:url" content="https://ddfmkghdn5-cyber.github.io/Temporizador-/"><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1120;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(100%,480px);border-radius:26px;overflow:hidden;background:#172035;box-shadow:0 24px 80px #0009;border:1px solid #ffffff1f}.top{padding:24px 24px 10px;text-align:center}.eyebrow{color:#ffbd85;letter-spacing:.17em;font-size:11px;font-weight:800}h1{font-size:34px;margin:10px 0 6px;letter-spacing:-.04em}p{color:#c8d0de;line-height:1.5;margin:6px 0 12px}.scene{position:relative;height:330px;overflow:hidden;background:radial-gradient(ellipse at center,#374563 0%,#18233b 65%,#111a2c);display:flex;align-items:center;justify-content:center}.hourglass{position:relative;width:178px;height:274px;filter:drop-shadow(0 12px 18px #0008)}.glass{position:absolute;inset:9px 12px;clip-path:polygon(0 0,100% 0,100% 8%,54% 48%,54% 52%,100% 92%,100% 100%,0 100%,0 92%,46% 52%,46% 48%,0 8%);background:linear-gradient(100deg,#ffffff4d,#9dc9e51a 30%,#dceeff22 70%,#ffffff60);border-radius:18px}.outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sandtop,.sandbottom{position:absolute;left:19px;right:19px;overflow:hidden}.sandtop{top:19px;height:111px;clip-path:polygon(0 0,100% 0,50% 100%)}.sandbottom{bottom:19px;height:111px;clip-path:polygon(50% 0,100% 100%,0 100%)}.grain{position:absolute;inset:0;background:linear-gradient(115deg,#ffdf8d,#f5ab46 65%,#d67b2c);box-shadow:inset 0 0 15px #fff8}.sandtop .grain{transform-origin:top;transform:scaleY(1)}.sandbottom .grain{transform-origin:bottom;transform:scaleY(0)}.stream{position:absolute;top:134px;left:calc(50% - 2px);width:4px;height:20px;background:linear-gradient(#ffe8a2,#f5ad4c);border-radius:8px;box-shadow:0 0 8px #ffd16e;animation:shimmer .4s linear infinite alternate}@keyframes shimmer{to{opacity:.45}}.scene.done .stream{display:none}.scene.done .sandtop .grain{transform:scaleY(0)}.scene.done .sandbottom .grain{transform:scaleY(1)}.overlay{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#eec995;font-size:12px;font-weight:700;letter-spacing:.08em}.panel{padding:22px 24px 28px;text-align:center}.clock{font-size:clamp(56px,15vw,78px);font-weight:800;letter-spacing:-.07em;font-variant-numeric:tabular-nums;line-height:1.1}.hint{color:#aebcd0;font-size:13px;margin:9px 0 15px}.progress{height:7px;border-radius:8px;background:#36445c;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff8b66,#ffd27d);width:100%}label{display:block;text-align:left;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;background:#0c1629;border:1px solid #52617a;border-radius:12px;color:white;padding:13px;font:inherit}button{width:100%;border:0;border-radius:12px;padding:15px;margin:11px 0 0;background:#ffad6a;color:#261426;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#32425b;color:#fff}.hidden{display:none}.note{color:#aebbd0;font-size:12px;line-height:1.5;margin-top:12px}.status{color:#bce5d0;font-size:13px;min-height:18px;margin-top:12px}footer{font-size:11px;color:#7d91aa;text-align:center;margin:12px}</style></head><body><main class="card"><header class="top"><div class="eyebrow">⏳ CADA SEGUNDO CUENTA</div><h1>Cuenta atrás</h1><p id="description">La arena cae hasta que se agote el tiempo.</p></header><div id="scene" class="scene"><div class="hourglass"><div class="glass"></div><div class="sandtop"><div id="topgrain" class="grain"></div></div><div class="sandbottom"><div id="bottomgrain" class="grain"></div></div><div id="stream" class="stream"></div><svg class="outline" viewBox="0 0 178 274" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 8H161V23C161 65 105 113 91 135C105 159 161 209 161 251V266H17V251C17 209 73 159 87 135C73 113 17 65 17 23V8Z" stroke="#b8d7e9" stroke-width="5" stroke-linejoin="round"/><path d="M10 8H168M10 266H168" stroke="#e8c18a" stroke-width="13" stroke-linecap="round"/><path d="M28 31C30 70 58 103 76 125" stroke="#ffffff55" stroke-width="5" stroke-linecap="round"/></svg></div><div id="skylabel" class="overlay">RELOJ DE ARENA</div></div><section class="panel"><div id="setup"><label for="minutes">¿Cuántos minutos?</label><input id="minutes" type="number" min="1" max="10080" value="10" inputmode="numeric"><label for="message">Mensaje para tu amigo (opcional)</label><input id="message" maxlength="120" placeholder="¡¡Responde antes de que se acabe el tiempo!"><button id="start">⏳ Iniciar cuenta atrás</button><div class="note">La cuenta atrás empieza al pulsar Iniciar. Comparte el enlace enseguida.</div></div><div id="active" class="hidden"><div id="clock" class="clock">10:00</div><div class="progress"><span id="progress"></span></div><div id="deadline" class="hint"></div><div id="ownercontrols"><button id="share">Enviar por WhatsApp</button><button class="secondary" id="copy">Copiar enlace</button><button class="secondary" id="again">Crear otra cuenta atrás</button></div><div class="status" id="status"></div></div></section><footer>Cuenta atrás · El mismo tiempo para todos</footer><script>
(()=>{const $=id=>document.getElementById(id),base=location.origin+location.pathname;let timer;function show(end,duration,message){$('setup').classList.add('hidden');$('active').classList.remove('hidden');$('description').textContent=message||'La arena cae mientras el tiempo se agota.';$('deadline').textContent='Termina: '+new Date(end).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'medium'});clearInterval(timer);function update(){let ms=Math.max(0,end-Date.now()),seconds=Math.ceil(ms/1000),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60,ratio=Math.min(1,Math.max(0,ms/duration));$('clock').textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('topgrain').style.transform='scaleY('+ratio+')';$('bottomgrain').style.transform='scaleY('+(1-ratio)+')';$('progress').style.width=(ratio*100)+'%';$('scene').classList.toggle('done',ms===0);$('skylabel').textContent=ms?'LA ARENA ESTÁ CAYENDO':'EL TIEMPO HA TERMINADO';if(!ms){$('description').textContent='Se acabó el tiempo. La arena ha caído.';clearInterval(timer)}}update();timer=setInterval(update,200)}
const raw=location.hash.slice(1),p=new URLSearchParams(raw);let end=Number(p.get('end')),duration=Number(p.get('duration')),initialMsg=p.get('message')||'';if(raw.startsWith('t=')){const bits=raw.slice(2).split('.');end=parseInt(bits[0],36)*1000;duration=parseInt(bits[1],36)*1000;initialMsg=''}if(Number.isFinite(end)&&end>0&&Number.isFinite(duration)&&duration>0)show(end,duration,initialMsg);
$('start').onclick=()=>{const n=Number($('minutes').value);if(!Number.isFinite(n)||n<1||n>10080){alert('Introduce un valor entre 1 y 10.080 minutos.');return}const d=Math.round(n*60000),e=Math.ceil((Date.now()+d)/1000)*1000,msg=$('message').value.trim();history.replaceState(null,'',base+'#t='+Math.floor(e/1000).toString(36)+'.'+Math.floor(d/1000).toString(36));sessionStorage.setItem('countdown_message',msg);show(e,d,msg)};
$('share').onclick=()=>{const msg=sessionStorage.getItem('countdown_message')||'El tiempo se agota';const text='⏳ *CUENTA ATRÁS*\n'+msg+'\nMira cómo cae la arena y cuánto tiempo queda:\n'+location.href;window.location.href='https://wa.me/?text='+encodeURIComponent(text)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent='Enlace copiado. Pégalo en WhatsApp.'}catch{prompt('Copia este enlace:',location.href)}};
$('again').onclick=()=>location.href=base;
})();
</script></main></body></html>
